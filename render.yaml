# Render Blueprint for the MaxPreps scraper API.
# Create the service from the Render dashboard: New + -> Blueprint -> point at this repo.
services:
  - type: web
    name: dimedropper-scraper-api
    runtime: python
    plan: standard # 2 GB RAM / 1 CPU. starter (512 MB) OOM-kills big-state discovery crawls.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Comma-separated list of allowed frontend origins, e.g.
      #   https://your-app.vercel.app
      # Leave as "*" for the first deploy, then tighten to the Vercel URL.
      - key: FRONTEND_ORIGIN
        value: "*"
      # Must be 1 while MEMUSAGE_LIMIT_MB is high: the cap is per-process, so two crawls
      # at 1600 MB would exceed the 2 GB box and cause an ungraceful OS OOM kill. To run
      # 2 concurrently, drop MEMUSAGE_LIMIT_MB to ~800 first.
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      # Graceful memory cap per crawl (MB). The crawl closes itself and flushes partial
      # CSVs before the 2 GB host OOM-kills it. 1600 + ~400 MB (web/OS/overshoot) ≈ 2 GB.
      - key: MEMUSAGE_LIMIT_MB
        value: "1600"
      # Graceful wall-clock cap per crawl (s); self-closes with partial data. 0 disables.
      # Set high (4 h) so a single-state, all-sports discovery crawl runs to full
      # convergence instead of being truncated at 30 min (the old 1800 left big states
      # -- and even FL -- with missing schools). JOBDIR keeps memory ~55-70 MB, so the
      # binding limit is time, not RAM. A graceful self-close still flushes the CSV and
      # runs enrichment, so keep this a finite value (below the watchdog) rather than 0.
      # NOTE: guaranteed 100% coverage of the very largest states / multi-state "all"
      # runs is still best done locally with backfill_all.py (fully uncapped). The 2 GB
      # box bounds what a live web crawl can realistically finish.
      - key: CLOSESPIDER_TIMEOUT
        value: "14400"
      # Last-resort watchdog (s); must exceed CLOSESPIDER_TIMEOUT + GoFan 900 + NFHS 900
      # (= 16200) so a legitimate long crawl self-closes gracefully before the watchdog
      # terminates it mid-run. 18000 leaves ~30 min of margin.
      - key: JOB_MAX_RUNTIME_SECONDS
        value: "18000"
