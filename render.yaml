# Render Blueprint for the MaxPreps scraper API.
# Create the service from the Render dashboard: New + -> Blueprint -> point at this repo.
services:
  - type: web
    name: dimedropper-scraper-api
    runtime: python
    plan: standard # 2 GB RAM / 1 CPU. starter (512 MB) OOM-kills big-state discovery crawls.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Comma-separated list of allowed frontend origins, e.g.
      #   https://your-app.vercel.app
      # Leave as "*" for the first deploy, then tighten to the Vercel URL.
      - key: FRONTEND_ORIGIN
        value: "*"
      # WARNING: this is 2 while MEMUSAGE_LIMIT_MB is 1600, and that cap is PER PROCESS --
      # two crawls that both approach it would exceed the 2 GB box and trigger an ungraceful
      # OS OOM kill instead of the graceful self-close. In practice JOBDIR keeps a crawl at
      # ~55-70 MB so this rarely bites, but to make 2 concurrent jobs safe by construction,
      # drop MEMUSAGE_LIMIT_MB to ~800 (or set this back to 1).
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      # Graceful memory cap per crawl (MB). The crawl closes itself and flushes partial
      # CSVs before the 2 GB host OOM-kills it. 1600 + ~400 MB (web/OS/overshoot) ≈ 2 GB.
      - key: MEMUSAGE_LIMIT_MB
        value: "1600"
      # Graceful wall-clock cap per crawl (s); self-closes with partial data. 0 disables.
      # Set high (4 h) so a single-state, all-sports discovery crawl runs to full
      # convergence instead of being truncated at 30 min (the old 1800 left big states
      # -- and even FL -- with missing schools). JOBDIR keeps memory ~55-70 MB, so the
      # binding limit is time, not RAM. A graceful self-close still flushes the CSV and
      # runs enrichment, so keep this a finite value (below the watchdog) rather than 0.
      # NOTE: guaranteed 100% coverage of the very largest states / multi-state "all"
      # runs is still best done locally with backfill_all.py (fully uncapped). The 2 GB
      # box bounds what a live web crawl can realistically finish.
      - key: CLOSESPIDER_TIMEOUT
        value: "14400"
      # Last-resort watchdog (s); must exceed CLOSESPIDER_TIMEOUT 14400 + opponent harvest
      # 1800 + roster 1200 + GoFan 900 + NFHS 900 + opponent resolve 300 (= 19500) so a
      # legitimate long crawl self-closes gracefully before the watchdog terminates it
      # mid-run. 21600 leaves 35 min of margin. Raise this whenever an enrichment cap in
      # worker.py goes up.
      - key: JOB_MAX_RUNTIME_SECONDS
        value: "21600"
      # --- GoFan middle-school flow (POST /ms/gofan) -------------------------------
      # Independent of the MaxPreps knobs above: separate job registry, separate output
      # dir (ms_jobs/), separate caps. Raising or lowering these cannot affect a crawl.
      #
      # Kept at 1. A run is ~35 min of steady outbound requests to api.gofan.co and the
      # worker already saturates its own 8-way concurrency, so a second parallel job
      # would double our request rate against GoFan for no throughput gain.
      - key: MS_MAX_CONCURRENT_JOBS
        value: "1"
      # There is NO total-runtime cap on a middle-school job, by design. Runtime scales
      # linearly with the uploaded row count (~106 ms/row = ~2 min per 1,000 rows), so any
      # fixed ceiling is really a row-count ceiling -- the previous 5400s value silently
      # killed anything past ~44k rows. Liveness is judged instead by the worker's
      # progress heartbeat: a job is failed only once that stops advancing for this long.
      # Must comfortably exceed the slowest single item; the worker heartbeats every 25
      # rows, so 15 min is very generous.
      - key: MS_JOB_STALL_SECONDS
        value: "900"
      # Optional absolute backstop (s) for a job that heartbeats but never ends. 0 = off,
      # which is the default and the recommended setting -- any finite value reintroduces
      # the row-count ceiling described above.
      - key: MS_JOB_MAX_RUNTIME_SECONDS
        value: "0"
      # Upload ceiling (bytes) for the CSV, default 1 GB (~700k rows). The worker streams
      # rows a chunk at a time, so peak RSS is ~50 MB regardless of file size -- memory no
      # longer scales with the row count, and this is only a guard against a runaway
      # upload filling the instance's disk.
      - key: MS_MAX_UPLOAD_BYTES
        value: "1073741824"
